name: CI - App2 Monitoring

on:
  workflow_dispatch:
    inputs:
      run-tests:
        description: 'Run tests?'
        type: boolean
        default: true
      node-version:
        description: 'Node version (optional)'
        type: string
        required: false

# 🔑 AJOUTER CES PERMISSIONS
permissions:
  contents: read
  actions: write  # Crucial pour déclencher d'autres workflows

jobs:
  trigger-template:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger template workflow
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const response = await github.rest.actions.createWorkflowDispatch({
                owner: 'nohaila1231',
                repo: 'template-pro',
                workflow_id: 'ci-workflow-dispatch.yml',
                ref: 'main',
                inputs: {
                  'target-repo': 'nohaila1231/app-2-api',
                  'run-tests': '${{ github.event.inputs.run-tests }}',
                  'node-version': '${{ github.event.inputs.node-version || '' }}'
                }
              });
              console.log('✅ Workflow déclenché avec succès');
              console.log('Réponse:', response);
            } catch (error) {
              console.error('❌ Erreur:', error.message);
              console.error('Status:', error.status);
              throw error;
            }
