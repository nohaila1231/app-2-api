name: CI - App2 Monitoring

on:
  workflow_dispatch:
    inputs:
      run-tests:
        description: 'Run tests?'
        type: boolean
        default: true
      node-version:
        description: 'Node version (optional)'
        type: string
        required: false

permissions:
  contents: read

jobs:
  trigger-template:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger template workflow with PAT
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PAT_TOKEN }}  # ← AJOUTE ÇA !!!
          script: |
            try {
              const response = await github.rest.actions.createWorkflowDispatch({
                owner: 'nohaila1231',
                repo: 'template-pro',
                workflow_id: 'ci-workflow-dispatch.yml',
                ref: 'main',
                inputs: {
                  'target-repo': 'nohaila1231/app-2-api',
                  'run-tests': '${{ github.event.inputs.run-tests }}',
                  'node-version': '${{ github.event.inputs.node-version || '' }}'
                }
              });
              console.log('✅ Workflow déclenché avec succès');
              console.log('📦 Target: nohaila1231/app-2-api');
              console.log('🧪 Tests: ${{ github.event.inputs.run-tests }}');
            } catch (error) {
              console.error('❌ Erreur:', error.message);
              if (error.status === 403) {
                console.error('⚠️ Le PAT token a-t-il les droits "repo" et "workflow"?');
              }
              throw error;
            }
